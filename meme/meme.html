<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GTA 6 wait meme</title>
<style>
  html, body { margin: 0; padding: 0; background: #12081f; }
  svg { display: block; }
  .cap { font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif; font-weight: 900;
         fill: #ffffff; stroke: #000000; stroke-linejoin: round; paint-order: stroke fill;
         text-anchor: middle; letter-spacing: 1px; }
  .ui  { font-family: "Segoe UI", Arial, sans-serif; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0a3a"/>
      <stop offset="0.45" stop-color="#7b1f86"/>
      <stop offset="0.78" stop-color="#ee4b8f"/>
      <stop offset="1" stop-color="#ffb04a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe46b"/>
      <stop offset="0.6" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1f78"/>
      <stop offset="1" stop-color="#170a33"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1640"/>
      <stop offset="1" stop-color="#14081c"/>
    </linearGradient>
    <clipPath id="sunClip"><rect x="0" y="0" width="1600" height="640"/></clipPath>
    <clipPath id="sunDisc"><circle cx="800" cy="640" r="270"/></clipPath>
    <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <!-- make.fun's ghost mascot, from the press kit's mark.svg (32-unit grid), without its disc -->
    <g id="ghost">
      <path d="M6.2 13a8.2 8.2 0 0 1 16.4 0v4.6c1 .2 1.8.8 2 2-.2 1.2-1 1.9-2 2.2V25a2.6 2.6 0 0 1-2.6 2.6c-2 0-4.6 0-5.7-.7-1.1.7-3.7.7-5.5.7A2.6 2.6 0 0 1 6.2 25v-.7c-1.2.3-3.5.1-3.6-1.9-.1-2.1 1.3-4.8 3.6-6.2z" fill="#191419" stroke="#191419" stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M6.2 13a8.2 8.2 0 0 1 16.4 0v4.6c1 .2 1.8.8 2 2-.2 1.2-1 1.9-2 2.2V25a2.6 2.6 0 0 1-2.6 2.6c-2 0-4.6 0-5.7-.7-1.1.7-3.7.7-5.5.7A2.6 2.6 0 0 1 6.2 25v-.7c-1.2.3-3.5.1-3.6-1.9-.1-2.1 1.3-4.8 3.6-6.2z" fill="#ffffff"/>
      <path d="M6.3 24.1v-2.5m8 5.8v-1.5" fill="none" stroke="#191419" stroke-width="1.25" stroke-linecap="round"/>
      <path d="M13.2 10.6Q13.632 11.968 15 12.4Q13.632 12.832 13.2 14.2Q12.768 12.832 11.4 12.4Q12.768 11.968 13.2 10.6z" fill="#191419"/>
      <path d="M19.3 9.8Q19.732 11.168 21.1 11.6Q19.732 12.032 19.3 13.4Q18.868 12.032 17.5 11.6Q18.868 11.168 19.3 9.8z" fill="#191419"/>
      <circle cx="26.5" cy="13.4" r="5.5" fill="#191419"/>
      <circle cx="26.5" cy="13.4" r="3.8" fill="#c41c83"/>
      <path d="M26.926 11.395L27.154 12.811L28.539 13.186L27.262 13.84L27.334 15.273L26.317 14.261L24.977 14.772L25.625 13.492L24.725 12.375L26.142 12.596z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round"/>
      <circle cx="24.9" cy="19.6" r="4" fill="#191419"/>
      <circle cx="24.9" cy="19.6" r="2.3" fill="#ffffff"/>
    </g>
    <g id="bill">
      <rect x="-46" y="-24" width="92" height="48" rx="5" fill="#7fd67a" stroke="#1e4d22" stroke-width="4"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="#1e4d22" stroke-width="3.5"/>
      <text x="0" y="9" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" fill="#1e4d22" text-anchor="middle">$</text>
    </g>
    <g id="palm">
      <path d="M0 0 C 10 -120, 30 -240, 70 -360" fill="none" stroke="#12061d" stroke-width="22" stroke-linecap="round"/>
      <g transform="translate(70 -360)" fill="#12061d">
        <path d="M0 0 C -60 -40, -140 -30, -200 20 C -130 -10, -60 0, 0 0z"/>
        <path d="M0 0 C -40 -70, -110 -110, -170 -100 C -100 -80, -40 -40, 0 0z"/>
        <path d="M0 0 C 10 -80, 60 -130, 120 -140 C 70 -100, 30 -50, 0 0z"/>
        <path d="M0 0 C 70 -40, 150 -30, 210 20 C 140 -5, 70 0, 0 0z"/>
        <path d="M0 0 C 60 10, 120 60, 140 130 C 100 70, 50 30, 0 0z"/>
        <path d="M0 0 C -50 20, -100 70, -110 140 C -80 80, -40 35, 0 0z"/>
      </g>
    </g>
  </defs>

  <!-- sky, synthwave sun, sea -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g clip-path="url(#sunClip)">
    <circle cx="800" cy="640" r="270" fill="url(#sun)"/>
    <g fill="#b8317f" clip-path="url(#sunDisc)">
      <rect x="500" y="520" width="600" height="8"/>
      <rect x="500" y="552" width="600" height="11"/>
      <rect x="500" y="584" width="600" height="14"/>
      <rect x="500" y="614" width="600" height="18"/>
    </g>
  </g>
  <rect x="0" y="640" width="1600" height="360" fill="url(#sea)"/>
  <g stroke="#ff8fc4" stroke-linecap="round" opacity="0.55">
    <line x1="640" y1="668" x2="960" y2="668" stroke-width="5"/>
    <line x1="680" y1="700" x2="920" y2="700" stroke-width="4"/>
    <line x1="720" y1="732" x2="880" y2="732" stroke-width="3"/>
  </g>
  <!-- the beach -->
  <path d="M0 790 C 400 760, 1200 770, 1600 800 L1600 1000 L0 1000z" fill="url(#sand)"/>

  <!-- palms framing the scene -->
  <use href="#palm" transform="translate(70 860) scale(1.05)"/>
  <use href="#palm" transform="translate(1530 870) scale(-1.1 1.1)"/>

  <!-- neon motel sign, worked into the skyline -->
  <g transform="translate(1185 300)">
    <rect x="0" y="0" width="310" height="120" rx="14" fill="#1a0a2b" stroke="#2c1446" stroke-width="6"/>
    <rect x="118" y="120" width="16" height="380" fill="#1a0a2b"/>
    <rect x="176" y="120" width="16" height="380" fill="#1a0a2b"/>
    <text x="155" y="80" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="74" fill="#ff5fc1" filter="url(#neon)">make.fun</text>
    <text x="155" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#6ff2ff" filter="url(#neon)">BOUNTIES · VICE CITY</text>
  </g>

  <!-- the download that never ends -->
  <g transform="translate(150 255)" class="ui">
    <rect x="0" y="0" width="560" height="200" rx="16" fill="#0d0618" fill-opacity="0.86" stroke="#6ff2ff" stroke-width="3"/>
    <text x="32" y="56" font-size="27" font-weight="700" fill="#ffffff">Downloading Grand Theft Auto VI</text>
    <rect x="32" y="88" width="496" height="34" rx="17" fill="#2a1840"/>
    <rect x="32" y="88" width="169" height="34" rx="17" fill="#ff5fc1"/>
    <text x="32" y="168" font-size="25" fill="#c9b8e6">34%  ·  9 h 47 min left</text>
  </g>

  <!-- the AI agent, already rich: make.fun's ghost sitting on its bounty winnings -->
  <ellipse cx="910" cy="822" rx="250" ry="34" fill="#000000" opacity="0.35" filter="url(#soft)"/>
  <g stroke="#1e4d22" stroke-width="4">
    <rect x="700" y="790" width="420" height="34" rx="5" fill="#5fb85a"/>
    <rect x="720" y="758" width="380" height="34" rx="5" fill="#6cc867"/>
    <rect x="745" y="726" width="330" height="34" rx="5" fill="#7fd67a"/>
  </g>
  <g fill="#1e4d22" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle">
    <text x="760" y="815">$</text><text x="1060" y="815">$</text>
    <text x="780" y="783">$</text><text x="1040" y="783">$</text>
  </g>
  <g transform="translate(700 355) scale(13.5)">
    <use href="#ghost"/>
  </g>

  <!-- money raining in -->
  <use href="#bill" transform="translate(690 390) rotate(-18)"/>
  <use href="#bill" transform="translate(1135 330) rotate(14)"/>
  <use href="#bill" transform="translate(620 600) rotate(10) scale(0.9)"/>
  <use href="#bill" transform="translate(1160 560) rotate(-12) scale(0.9)"/>
  <use href="#bill" transform="translate(905 300) rotate(4) scale(0.8)"/>

  <!-- the captions -->
  <text class="cap" x="800" y="128" font-size="104" stroke-width="12">WAITED 13 YEARS FOR GTA 6</text>
  <text class="cap" x="800" y="905" font-size="76" stroke-width="10">MY AI AGENT PAID FOR IT</text>
  <text class="cap" x="800" y="980" font-size="76" stroke-width="10">BEFORE THE DOWNLOAD FINISHED</text>
</svg>
</body>
</html>
